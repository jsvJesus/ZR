<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">

    <link rel="stylesheet" href="hud.css">

    <title>Player HUD</title>
</head>

<body>
    <main class="hud" id="hud">
        <header class="hud-header">
            <span>СОСТОЯНИЕ ПЕРСОНАЖА</span>
            <span id="condition">НОРМА</span>
        </header>

        <section class="stat health">
            <div class="stat-title">
                <span>ЗДОРОВЬЕ</span>
                <span id="health-value">—</span>
            </div>

            <div class="bar">
                <div class="bar-fill"
                     id="health-bar"></div>
            </div>
        </section>

        <section class="stat stamina">
            <div class="stat-title">
                <span>ВЫНОСЛИВОСТЬ</span>
                <span id="stamina-value">—</span>
            </div>

            <div class="bar">
                <div class="bar-fill"
                     id="stamina-bar"></div>
            </div>
        </section>

        <div class="survival">
            <section class="stat satiety">
                <div class="stat-title">
                    <span>СЫТОСТЬ</span>
                    <span id="satiety-value">—</span>
                </div>

                <div class="bar">
                    <div class="bar-fill"
                         id="satiety-bar"></div>
                </div>
            </section>

            <section class="stat hydration">
                <div class="stat-title">
                    <span>ВОДА</span>
                    <span id="hydration-value">—</span>
                </div>

                <div class="bar">
                    <div class="bar-fill"
                         id="hydration-bar"></div>
                </div>
            </section>
        </div>

        <footer class="weight">
            <span>ПЕРЕНОСИМЫЙ ВЕС</span>
            <span id="weight-value">—</span>
        </footer>

        <div class="effects">
            <span id="effect-hunger" hidden>ГОЛОД</span>
            <span id="effect-thirst" hidden>ЖАЖДА</span>
            <span id="effect-overload" hidden>ПЕРЕГРУЗ</span>
            <span id="effect-bleeding" hidden>КРОВОТЕЧЕНИЕ</span>
            <span id="effect-radiation" hidden>РАДИАЦИЯ</span>
            <span id="effect-intoxication" hidden>ИНТОКСИКАЦИЯ</span>
        </div>
    </main>

    <script src="hud.js"></script>
</body>
</html>
